name: Sync official stable versions

on:
  workflow_dispatch:

concurrency:
  group: aarch64-stable-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  sync:
    if: github.repository == 'T-Py-T/omarchy-pkgs' && github.ref_name == 'arm64-v4.0.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Synchronize AArch64 recipes
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm curl git jq libarchive patch
              groupadd -g "$HOST_GID" runner
              useradd -m -u "$HOST_UID" -g "$HOST_GID" runner
              chown -R runner:runner /workspace
              runuser -u runner -- ./bin/sync-aur bindfs dotnet-runtime-bin
              runuser -u runner -- ./bin/sync-upstream obsidian
              runuser -u runner -- ./bin/sync-official-stable
              runuser -u runner -- ./test/aarch64-downstream-test.sh
            '

      - name: Commit synchronized recipes
        id: commit
        run: |
          set -euo pipefail
          if [[ -z $(git status --porcelain) ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkgbuilds
          git commit -m 'chore: update AArch64 package versions'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Start an AArch64 stable build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-aarch64.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
