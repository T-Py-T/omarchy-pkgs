name: Publish Omarchy 4.0.1 AArch64 repository

on:
  workflow_dispatch:

concurrency:
  group: omarchy-4.0.1-aarch64-repository
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-sign-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse to replace the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.1-aarch64-repo.1 >/dev/null 2>&1; then
            echo "Release v4.0.1-aarch64-repo.1 already exists; refusing to replace it." >&2
            exit 1
          fi

      - name: Seed the checksum-pinned v4.0.1 package snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/download-aarch64-baseline

      - name: Rebuild the T-Py-T runtime and signing keyring natively
        run: |
          ./bin/repo build \
            --arch aarch64 \
            --mirror stable \
            --force-explicit \
            --rebuild-explicit \
            --package omarchy-aarch64-keyring omarchy-spice-guest-tools omarchy-settings omarchy

      - name: Assemble, sign, and validate the complete repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.AARCH64_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.AARCH64_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p build-output/stable/aarch64
          baseline=(pkgs.omarchy.org/stable/aarch64/*.pkg.tar.zst)
          for package in "${baseline[@]}"; do
            destination="build-output/stable/aarch64/${package##*/}"
            [[ -e $destination ]] || cp -- "$package" "$destination"
          done
          ./bin/derive-aarch64-version-set \
            --baseline pkgs.omarchy.org/stable/aarch64/repository-version-set.json \
            --output repository-version-set.json
          ./bin/prepare-github-release --version-set repository-version-set.json

      - name: Create and independently verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_dir=pkgs.omarchy.org/stable/aarch64
          tag=v4.0.1-aarch64-repo.1

          gh release create "$tag" \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Omarchy 4.0.1 AArch64 package repository" \
            --notes "Immutable, signed AArch64 package snapshot for the T-Py-T Omarchy 4.0.1 ISO. Seeded from riverscn release 378203967 after verifying SHA256SUMS digest 17577cfd820bf254d72a3a25d6156f0fdb918fd507cc230d8fff027c5f7dcff2; T-Py-T runtime and keyring packages are rebuilt natively and all assets are re-signed with fingerprint 8AA9588904E3054143C07CA0A07D975502D3355F." \
            "$repo_dir"/*.pkg.tar.zst \
            "$repo_dir"/*.pkg.tar.zst.sig \
            "$repo_dir"/omarchy.db \
            "$repo_dir"/omarchy.db.sig \
            "$repo_dir"/omarchy.db.tar.zst \
            "$repo_dir"/omarchy.db.tar.zst.sig \
            "$repo_dir"/omarchy.files \
            "$repo_dir"/omarchy.files.sig \
            "$repo_dir"/omarchy.files.tar.zst \
            "$repo_dir"/omarchy.files.tar.zst.sig \
            "$repo_dir"/omarchy-aarch64.gpg \
            "$repo_dir"/repository-version-set.json \
            "$repo_dir"/repository-manifest.json \
            "$repo_dir"/SHA256SUMS

          downloaded="$RUNNER_TEMP/release-assets"
          mkdir -p "$downloaded"
          gh release download "$tag" --dir "$downloaded"
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          verify_home=$(mktemp -d)
          trap 'rm -rf "$verify_home"' EXIT
          chmod 700 "$verify_home"
          GNUPGHOME="$verify_home" gpg --batch --import "$downloaded/omarchy-aarch64.gpg" >/dev/null 2>&1
          actual_fingerprint=$(GNUPGHOME="$verify_home" gpg --batch --show-keys --with-colons \
            "$downloaded/omarchy-aarch64.gpg" | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ $actual_fingerprint == 8AA9588904E3054143C07CA0A07D975502D3355F ]]
          for asset in "$downloaded"/*.pkg.tar.zst \
            "$downloaded"/omarchy.db "$downloaded"/omarchy.db.tar.zst \
            "$downloaded"/omarchy.files "$downloaded"/omarchy.files.tar.zst; do
            GNUPGHOME="$verify_home" gpg --batch --verify "$asset.sig" "$asset"
          done
          gh release edit "$tag" --draft=false
